<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>Unit Converter - Temperature</title>
</head>
<body>
  <main class="card">
    <h1 class="title">Unit Converter</h1>

    <nav class="nav">
      <a href="length.html" class="nav-link">Length</a>
      <a href="weight.html" class="nav-link">Weight</a>
      <a href="Temperature.html" class="nav-link active">Temperature</a>
    </nav>

    <form class="converter-form">
      <label for="input-text">Enter the temperature to convert</label>
      <input type="text" id="input-text" class="input-text">

      <label for="input-from">Unit to Convert from</label>
      <input type="text" id="input-from" class="input-from">

      <label for="input-to">Unit to Convert to</label>
      <input type="text" id="input-to" class="input-to">

      <button class="button button-temperature">Convert</button>
    </form>

    <section class="result hidden">
      <p class="result-label">Result of your calculation</p>
      <p class="result-text"></p>
      <button class="button button-reset">Reset</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
